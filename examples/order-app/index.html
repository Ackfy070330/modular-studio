<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单管理示例</title><style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#f4f5f9;color:#243047;margin:0;padding:56px 24px}main{max-width:440px;margin:auto;background:white;padding:36px;border-radius:22px;box-shadow:0 16px 50px #1720380b}small{letter-spacing:2px;color:#8070c9}h1{font-size:25px;margin:22px 0 8px}p{color:#8490a1;line-height:1.8}label{display:block;font-size:12px;color:#556174;margin:22px 0}input{display:block;margin-top:8px;width:100%;padding:12px;border:1px solid #dfe3eb;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:13px;background:#7561d5;color:white;width:100%;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{overflow:auto;background:#f5f6fa;padding:16px;white-space:pre-wrap;border-radius:9px;font-size:12px}footer{text-align:center;color:#a2aaba;font-size:11px;margin-top:24px}</style></head><body><main><small>BUILT WITH MODULAR</small><h1>订单管理示例</h1><p>由功能蓝图生成 · 提交后实际执行后端流程</p><form id="form"><label>商品编号<input name="sku" type="text" value="SKU-001" required ></label><label>数量<input name="quantity" type="number" value="2" required step="any"></label><label>单价（分）<input name="unitPrice" type="number" value="100" required step="any"></label><button>提交并执行</button></form><pre id="result" hidden></pre></main><footer>模序 · 把想法连接成产品</footer><script>
const form = document.getElementById('form'), result = document.getElementById('result');
form.onsubmit = async e => { e.preventDefault(); form.querySelector('button').disabled = true; const input = {}; for(const el of form.querySelectorAll('input')) input[el.name] = el.type === 'number' ? Number(el.value) : el.value;
try { const res = await fetch("/api/orders", { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({input}) }); const body = await res.json(); if(!res.ok) throw new Error(body.message || '执行失败'); result.textContent = "订单创建成功" + '\n\n' + JSON.stringify(body.output, null, 2); } catch(e) { result.textContent = e.message; } finally { result.hidden = false; form.querySelector('button').disabled = false; } };
</script></body></html>
